<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealStars SaaS - GitHub Audit Tool</title>
    <script defer src="/_vercel/analytics/script.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #58a6ff; margin-bottom: 8px; font-size: 24px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%; padding: 12px; margin-bottom: 12px;
            border-radius: 6px; border: 1px solid #30363d;
            background-color: #0d1117; color: #fff;
            box-sizing: border-box; font-size: 14px;
        }
        button {
            width: 100%; padding: 12px; border-radius: 6px; border: none;
            background-color: #238636; color: white; font-weight: bold;
            cursor: pointer; font-size: 14px;
        }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #30363d; cursor: not-allowed; }
        #result {
            margin-top: 20px; padding: 15px; border-radius: 6px;
            background-color: #0d1117; border: 1px solid #30363d;
            display: none; text-align: left;
        }
        .metric { margin: 8px 0; font-size: 14px; }
        .status-real { color: #3fb950; font-weight: bold; }
        .status-fake { color: #f85149; font-weight: bold; }
        .status-warn { color: #e3b341; font-weight: bold; }
        .score-bar {
            width: 100%; height: 8px; background: #30363d;
            border-radius: 4px; margin: 8px 0; overflow: hidden;
        }
        .score-fill { height: 100%; transition: width 0.4s ease; }
        .reasons { font-size: 12px; color: #8b949e; margin-top: 10px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <h1>RealStars SaaS</h1>
    <p>Detect GitHub stars & repository activity instantly.</p>

    <input type="text" id="repoInput" placeholder="e.g. facebook/react or IT777guy/realstars-saas">
    <button id="analyzeBtn" onclick="analyzeRepo()">Analyze Repository</button>

    <div id="result"></div>
</div>

<script>
async function analyzeRepo() {
    const input = document.getElementById('repoInput').value.trim();
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('analyzeBtn');

    if (!input || !input.includes('/')) {
        alert('Please enter a repository in owner/repo format!');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Analyzing...';
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<p style="color: #e3b341;">Fetching data from GitHub API...</p>';

    try {
        const repoRes = await fetch(`https://api.github.com/repos/${input}`);
        if (!repoRes.ok) throw new Error('Repository not found!');
        const data = await repoRes.json();

        const stars = data.stargazers_count;
        const forks = data.forks_count;
        const openIssues = data.open_issues_count;
        const createdAt = new Date(data.created_at);
        const pushedAt = new Date(data.pushed_at);
        const repoAgeDays = Math.max(1, (Date.now() - createdAt) / 86400000);
        const daysSinceLastPush = (Date.now() - pushedAt) / 86400000;

        // --- Signal collection (0 = suspicious, 100 = healthy) ---
        let score = 100;
        const reasons = [];

        // Signal 1: star-to-fork ratio (adjusted for repo type/age, not a hard cutoff)
        const ratio = forks > 0 ? stars / forks : stars;
        if (stars >= 50 && ratio > 40) {
            score -= 25;
            reasons.push(`Unusually high star-to-fork ratio (${ratio.toFixed(1)}:1) for this star count.`);
        }

        // Signal 2: star velocity — stars per day since creation
        const starsPerDay = stars / repoAgeDays;
        if (stars >= 100 && starsPerDay > 15 && repoAgeDays < 60) {
            score -= 25;
            reasons.push(`Rapid star growth: ~${starsPerDay.toFixed(1)} stars/day on a repo only ${Math.round(repoAgeDays)} days old.`);
        }

        // Signal 3: stale repo with disproportionate stars
        if (stars >= 100 && daysSinceLastPush > 365) {
            score -= 15;
            reasons.push(`No commits in over a year despite ${stars} stars.`);
        }

        // Signal 4: very few issues relative to popularity (can indicate low real engagement)
        if (stars >= 200 && openIssues === 0 && forks < 10) {
            score -= 15;
            reasons.push('High star count but almost no community engagement (issues/forks).');
        }

        // Signal 5: not enough data to judge confidently
        let lowData = false;
        if (stars < 50) {
            lowData = true;
            reasons.push('Repository has too few stars for a reliable verdict.');
        }

        score = Math.max(0, Math.min(100, score));

        let statusClass = 'status-real';
        let statusText = 'Healthy / Genuine Stars';
        let barColor = '#3fb950';

        if (lowData) {
            statusClass = 'status-warn';
            statusText = 'Needs More Data';
            barColor = '#8b949e';
        } else if (score < 50) {
            statusClass = 'status-fake';
            statusText = 'Warning: Potential Fake/Bot Stars';
            barColor = '#f85149';
        } else if (score < 80) {
            statusClass = 'status-warn';
            statusText = 'Some Suspicious Signals';
            barColor = '#e3b341';
        }

        const reasonsHtml = reasons.length
            ? `<div class="reasons">${reasons.map(r => `• ${r}`).join('<br>')}</div>`
            : `<div class="reasons">• No suspicious patterns detected.</div>`;

        resultDiv.innerHTML = `
            <div class="metric"><strong>Repository:</strong> ${data.full_name}</div>
            <div class="metric">⭐ <strong>Stars:</strong> ${stars}</div>
            <div class="metric">🍴 <strong>Forks:</strong> ${forks}</div>
            <div class="metric">🐛 <strong>Open Issues:</strong> ${openIssues}</div>
            <hr style="border-color: #30363d; margin: 10px 0;">
            <div class="metric"><strong>Authenticity Score:</strong> ${lowData ? 'N/A' : score + '/100'}</div>
            <div class="score-bar"><div class="score-fill" style="width:${lowData ? 100 : score}%; background:${barColor};"></div></div>
            <div class="metric"><strong>Audit Result:</strong> <span class="${statusClass}">${statusText}</span></div>
            ${reasonsHtml}
        `;

    } catch (error) {
        resultDiv.innerHTML = `<p style="color: #f85149;">Error: ${error.message}</p>`;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Analyze Repository';
    }
}
</script>

</body>
</html>
